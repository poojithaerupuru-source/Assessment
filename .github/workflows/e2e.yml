name: E2E tests

on:
  # Manual trigger only for now: Actions tab -> "E2E tests" -> "Run workflow".
  # Once the page-object locators are real and the suite passes locally,
  # uncomment push/pull_request to run on every change.
  workflow_dispatch:
  # push:
  #   branches: [master]
  # pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Repository secrets -> environment variables read by qa-tests/utils/test-users.js
    env:
      CLAIMANT_EMAIL: ${{ secrets.CLAIMANT_EMAIL }}
      CLAIMANT_PASSWORD: ${{ secrets.CLAIMANT_PASSWORD }}
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      OTHER_CLAIMANT_EMAIL: ${{ secrets.OTHER_CLAIMANT_EMAIL }}
      OTHER_CLAIMANT_PASSWORD: ${{ secrets.OTHER_CLAIMANT_PASSWORD }}
      KEYCLOAK_ADMIN_USERNAME: ${{ secrets.KEYCLOAK_ADMIN_USERNAME }}
      KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
      KEYCLOAK_URL: http://localhost:8180
      BASE_URL: http://localhost:3001
      BFF_URL: http://localhost:8090

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # BUG-01: the UI's generated API client is git-ignored and the Dockerfile
      # never generates it, so the UI fails to build without this step.
      - name: Generate UI API client
        working-directory: code/demo-app-ui
        run: npm run generate:api

      # Called with `bash` because the scripts aren't executable in Git (mode 100644).
      - name: Start infrastructure (Postgres, Kafka, Redis, Keycloak)
        run: bash start-infra.sh

      - name: Build backend services
        run: |
          mvn -B -q package -Dmaven.test.skip=true -Dcheckstyle.skip -Dpmd.skip -f code/claims-service/pom.xml
          mvn -B -q package -Dmaven.test.skip=true -Dcheckstyle.skip -Dpmd.skip -f code/bff-service/pom.xml

      # start-app.sh runs in the foreground and would block the job, so start detached.
      - name: Start application containers
        run: docker compose -f docker-compose.apps.yml up -d --build

      - name: Wait for BFF and UI to be ready
        run: |
          timeout 300 bash -c 'until curl -sf http://localhost:8090/actuator/health; do echo "waiting for BFF..."; sleep 5; done'
          timeout 300 bash -c 'until curl -sf http://localhost:3001/login > /dev/null; do echo "waiting for UI..."; sleep 5; done'

      - name: Install test dependencies
        working-directory: qa-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: qa-tests
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: qa-tests/playwright-report
          retention-days: 14

      - name: Show container logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.apps.yml logs --tail=200
          docker compose -f docker-compose.infra.yml logs --tail=100 keycloak

      - name: Stop containers
        if: always()
        run: |
          docker compose -f docker-compose.apps.yml down -v || true
          docker compose -f docker-compose.infra.yml down -v || true
